[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safeguard"
version = "0.1.0"
description = "A real-time content safety decisioning platform built on production fraud-detection architecture."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Probal Bose" }]
keywords = ["content-moderation", "trust-and-safety", "real-time", "decisioning", "ml-inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
kafka = ["aiokafka>=0.10"]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
all = ["safeguard[redis,kafka,otel,dev]"]

[project.urls]
Homepage = "https://github.com/probalbose/safeguard"
Repository = "https://github.com/probalbose/safeguard"
Issues = "https://github.com/probalbose/safeguard/issues"

[project.scripts]
safeguard = "safeguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/safeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
packages = ["safeguard"]
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
